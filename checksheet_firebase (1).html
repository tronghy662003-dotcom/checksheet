<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Checksheet / 設備点検チェックシート</title>
<!-- ═══ FIREBASE SDK ═══ -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --blue:#1a5fa8;--blue-l:#e8f0fb;--blue-d:#0d3d6e;
  --green:#2e7d32;--green-l:#e8f5e9;
  --red:#c62828;--red-l:#ffebee;
  --orange:#e65100;--orange-l:#fff3e0;
  --gray:#607d8b;--gray-l:#f0f4f5;
  --border:#d0d7de;--text:#1a2027;--muted:#5a6472;
  --bg:#f4f6f8;--white:#fff;--r:10px;--rs:6px;
}
body{font-family:'Noto Sans','Segoe UI','Arial',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh}
/* ── ログイン ── */
#login-screen{position:fixed;inset:0;z-index:9999;background:var(--blue);display:flex;align-items:center;justify-content:center;padding:24px}
.lcard{background:var(--white);border-radius:16px;padding:32px 28px;width:100%;max-width:340px;box-shadow:0 8px 40px rgba(0,0,0,.25)}
.llogo{text-align:center;margin-bottom:24px}
.llogo-icon{width:60px;height:60px;border-radius:16px;background:var(--blue);display:inline-flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:10px}
.llogo h2{font-size:16px;font-weight:600;color:var(--text);margin-bottom:4px}
.llogo p{font-size:12px;color:var(--muted)}
.lfield{margin-bottom:14px}
.lfield label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.linput{width:100%;padding:12px 14px;font-size:15px;border:1.5px solid var(--border);border-radius:var(--rs);background:var(--white);color:var(--text);font-family:inherit;outline:none}
.linput:focus{border-color:var(--blue)}
.linput.err{border-color:var(--red);background:var(--red-l)}
.lbtn{width:100%;padding:14px;font-size:15px;font-weight:700;background:var(--blue);color:white;border:none;border-radius:var(--rs);cursor:pointer;font-family:inherit;margin-top:6px}
.lerr{text-align:center;font-size:13px;color:var(--red);font-weight:600;margin-top:12px;min-height:20px}
.lattempts{text-align:center;font-size:11px;color:var(--muted);margin-top:8px}
/* ── メイン ── */
#main-app{display:none}
.header{background:var(--blue);color:white;padding:14px 16px 12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.header h1{font-size:16px;font-weight:600}
.header p{font-size:11px;opacity:.8;margin-top:2px}
.tabs{display:flex;background:var(--white);border-bottom:1.5px solid var(--border);position:sticky;top:60px;z-index:99}
.tab{flex:1;padding:11px 2px;font-size:12px;text-align:center;border:none;background:none;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;font-family:inherit;font-weight:500}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.content{padding:12px}
.card{background:var(--white);border-radius:var(--r);border:1px solid var(--border);margin-bottom:10px;overflow:hidden}
.ctitle{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;padding:9px 14px;background:var(--gray-l);border-bottom:1px solid var(--border)}
.frow{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid #eef0f2}
.frow:last-child{border-bottom:none}
.flabel{font-size:12px;color:var(--muted);white-space:nowrap;width:100px;flex-shrink:0}
.finput{flex:1;padding:7px 10px;font-size:13px;border:1px solid var(--border);border-radius:var(--rs);background:var(--white);color:var(--text);font-family:inherit;outline:none}
.finput:focus{border-color:var(--blue)}
.shift-sel{display:flex;border:1.5px solid var(--border);border-radius:var(--rs);overflow:hidden;flex:1}
.shift-btn{flex:1;padding:9px 4px;font-size:13px;font-weight:600;border:none;background:var(--white);color:var(--muted);cursor:pointer;font-family:inherit}
.shift-btn.day.on{background:#fff8e1;color:#f57f17}
.shift-btn.night.on{background:#e8eaf6;color:#283593}
.pwrap{padding:8px 14px 6px;display:flex;align-items:center;gap:10px;background:var(--white);border-radius:var(--r);border:1px solid var(--border);margin-bottom:10px}
.pbar{flex:1;height:6px;background:#e0e0e0;border-radius:3px;overflow:hidden}
.pfill{height:100%;background:var(--blue);border-radius:3px;transition:width .3s}
.ptxt{font-size:12px;color:var(--muted);white-space:nowrap}
/* 点検項目 */
.iitem{padding:12px 14px;border-bottom:1px solid #eef0f2}
.iitem:last-child{border-bottom:none}
.itop{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.ino{width:26px;height:26px;border-radius:50%;background:var(--blue-l);color:var(--blue-d);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.iinfo{flex:1;min-width:0}
.iname{font-size:14px;font-weight:600}
.isub{font-size:11px;color:var(--muted);margin-top:2px}
.ialert{display:inline-block;font-size:10px;background:var(--orange-l);color:var(--orange);border:1px solid #ffcc80;border-radius:4px;padding:1px 6px;margin-top:3px}
.dnrow{display:flex;align-items:center;gap:8px}
.dnbtns{display:flex;gap:6px;flex:1}
.dnbtn{flex:1;padding:10px 4px;font-size:12px;font-weight:600;border:1.5px solid var(--border);border-radius:var(--rs);background:var(--white);cursor:pointer;color:var(--muted);font-family:inherit;touch-action:manipulation}
.dnbtn.ok{background:var(--green-l);color:var(--green);border-color:var(--green)}
.dnbtn.ng{background:var(--red-l);color:var(--red);border-color:var(--red)}
.dnbtn.na{background:var(--gray-l);color:var(--gray);border-color:var(--gray)}
.nwrap{flex:1;display:flex;align-items:center;border:1.5px solid var(--border);border-radius:var(--rs);background:var(--white);cursor:pointer;padding:10px 14px;gap:8px}
.nwrap.in-range{border-color:var(--green);background:var(--green-l)}
.nwrap.out-range{border-color:var(--red);background:var(--red-l)}
.nval{flex:1;font-size:16px;font-weight:700}
.nstat{font-size:10px;font-weight:600;padding:3px 8px;border-radius:10px;white-space:nowrap}
.nstat.in-range{background:var(--green-l);color:var(--green)}
.nstat.out-range{background:var(--red-l);color:var(--red)}
.nstat.empty{background:var(--gray-l);color:var(--muted);font-size:9px}
.remark{margin-top:8px;width:100%;padding:7px 10px;font-size:12px;border:1px solid var(--border);border-radius:var(--rs);background:#fafafa;color:var(--text);font-family:inherit;resize:none;outline:none}
/* 保存ボタン */
.savebtn{display:block;width:100%;margin:14px 0 4px;padding:16px;font-size:15px;font-weight:700;background:var(--blue);color:white;border:none;border-radius:12px;cursor:pointer;font-family:inherit;box-shadow:0 4px 16px rgba(26,95,168,.35)}
.savebtn:disabled{background:#9ab0cc;box-shadow:none;cursor:not-allowed}
.savehint{text-align:center;font-size:12px;color:var(--muted);margin-top:6px;padding-bottom:8px}
.weeklybtn{display:block;width:100%;margin-bottom:16px;padding:13px;font-size:13px;font-weight:700;background:#3949ab;color:white;border:none;border-radius:12px;cursor:pointer;font-family:inherit}
/* テンキー */
.np-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:600;align-items:center;justify-content:center}
.np-ov.open{display:flex}
.np-box{background:var(--white);border-radius:16px;width:calc(100% - 32px);max-width:380px;padding:16px 16px 24px;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.np-lbl{font-size:12px;color:var(--muted);margin-bottom:6px}
.np-drow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.np-disp{flex:1;font-size:28px;font-weight:700;background:var(--gray-l);border-radius:var(--rs);padding:10px 14px;min-height:52px}
.np-disp.in-range{background:var(--green-l);color:var(--green)}
.np-disp.out-range{background:var(--red-l);color:var(--red)}
.np-unit{font-size:14px;color:var(--muted)}
.np-range{font-size:11px;color:var(--muted);margin-bottom:12px;text-align:center}
.np-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.npk{padding:16px 4px;font-size:20px;font-weight:600;border:1.5px solid var(--border);border-radius:var(--rs);background:var(--white);cursor:pointer;font-family:inherit;text-align:center;touch-action:manipulation}
.npk.back{color:var(--red);border-color:var(--red);font-size:16px}
.np-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.npact{padding:14px;font-size:14px;font-weight:700;border:none;border-radius:var(--rs);cursor:pointer;font-family:inherit}
.npact.cancel{background:var(--gray-l);color:var(--muted)}
.npact.confirm{background:var(--blue);color:white}
/* 履歴・集計 */
.hitem{padding:12px 14px;border-bottom:1px solid #eef0f2;cursor:pointer}
.hitem:last-child{border-bottom:none}
.hdate{font-size:14px;font-weight:600}
.hmeta{font-size:12px;color:var(--muted);margin-top:2px}
.badges{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}
.bok{background:var(--green-l);color:var(--green)}
.bng{background:var(--red-l);color:var(--red)}
.bna{background:var(--gray-l);color:var(--gray)}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.scard{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px}
.slbl{font-size:11px;color:var(--muted);margin-bottom:4px}
.sval{font-size:24px;font-weight:700}
.ssub{font-size:11px;color:var(--muted);margin-top:2px}
.ngwrap{padding:12px 14px;border-bottom:1px solid #eef0f2}
.ngwrap:last-child{border-bottom:none}
.ngrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;font-size:12px}
.ngcnt{font-weight:700;color:var(--red)}
.ngbar{height:5px;background:#f5d0d0;border-radius:3px;overflow:hidden}
.ngfill{height:100%;background:var(--red);border-radius:3px}
.expbtn{display:block;width:100%;margin:10px 0 0;padding:13px;font-size:14px;font-weight:700;background:#1a7a40;color:white;border:none;border-radius:var(--r);cursor:pointer;font-family:inherit;text-align:center}
/* モーダル */
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;align-items:flex-end}
.modal-ov.open{display:flex}
.mbox{background:var(--white);border-radius:16px 16px 0 0;width:100%;max-height:85vh;overflow-y:auto;padding:16px}
.mtitle{font-size:15px;font-weight:700;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.mrow{display:grid;grid-template-columns:1fr 70px 70px;padding:7px 0;border-bottom:1px solid #f0f0f0;font-size:12px;gap:4px;align-items:center}
.mrow:last-child{border-bottom:none}
.mkey{color:var(--muted)}
.md,.mn{text-align:center;font-weight:600;font-size:12px}
.mcls{width:100%;margin-top:14px;padding:12px;background:var(--blue);color:white;border:none;border-radius:var(--rs);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.vok{color:var(--green)}.vng{color:var(--red)}.vna{color:var(--gray)}.vem{color:#ccc}
/* 共有 */
.surl{width:100%;padding:8px 10px;font-size:12px;border:1px solid var(--border);border-radius:var(--rs);background:#f8f9fa;color:var(--text);word-break:break-all;margin-bottom:8px;resize:none;font-family:inherit}
.scopy{width:100%;padding:10px;font-size:13px;font-weight:600;background:var(--blue);color:white;border:none;border-radius:var(--rs);cursor:pointer;font-family:inherit}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px}
/* 週次 */
.wm-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:700;align-items:center;justify-content:center}
.wm-ov.open{display:flex}
.wm-box{background:var(--white);border-radius:16px;width:calc(100% - 32px);max-width:360px;padding:20px}
.wm-title{font-size:15px;font-weight:700;margin-bottom:8px}
.wm-desc{font-size:12px;color:var(--muted);margin-bottom:12px}
.wm-input{width:100%;padding:10px 12px;font-size:14px;border:1.5px solid var(--border);border-radius:var(--rs);font-family:inherit;outline:none;margin-bottom:12px}
.wm-input:focus{border-color:var(--blue)}
.wm-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wm-act{padding:12px;font-size:14px;font-weight:700;border:none;border-radius:var(--rs);cursor:pointer;font-family:inherit}
.wm-act.cancel{background:var(--gray-l);color:var(--muted)}
.wm-act.ok{background:var(--blue);color:white}
.wl-item{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:.5px solid #eef0f2;font-size:12px}
.wl-item:last-child{border-bottom:none}
.wbadge{background:#e8eaf6;color:#283593;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px}
/* 言語ボタン */
.langbtn{position:fixed;bottom:16px;right:16px;z-index:300;background:var(--white);border:1.5px solid var(--border);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--blue);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#323232;color:white;padding:10px 20px;border-radius:24px;font-size:13px;font-weight:500;z-index:999;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
/* ── ダッシュボード ── */
#home-page{display:none;min-height:100vh;background:var(--bg)}
.home-header{background:linear-gradient(135deg,#0d3d6e 0%,#1a5fa8 100%);color:white;padding:20px 16px 16px;text-align:center}
.home-header h1{font-size:18px;font-weight:700;margin-bottom:4px}
.home-header p{font-size:12px;opacity:.8}
.home-header .user-bar{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:11px;opacity:.8}
.cat-tabs{display:none!important;gap:8px;padding:12px;background:var(--white);border-bottom:1px solid var(--border);overflow-x:auto}
.cat-tab{flex-shrink:0;padding:8px 14px;font-size:12px;font-weight:600;border-radius:20px;border:1.5px solid var(--border);background:var(--white);color:var(--muted);cursor:pointer;font-family:inherit;white-space:nowrap}
.cat-tab.active{background:var(--blue);color:white;border-color:var(--blue)}
.cat-tab.disabled{opacity:.45;cursor:not-allowed}
.layout-header{padding:12px 16px 8px;background:var(--white);margin-bottom:8px;border-bottom:1px solid var(--border)}
.layout-header h2{font-size:14px;font-weight:700;color:var(--text)}
.layout-header p{font-size:12px;color:var(--muted);margin-top:3px}
.eq-section{padding:0 8px 12px}
.eq-section-title{font-size:11px;font-weight:700;color:var(--white);background:var(--blue-d);padding:6px 12px;border-radius:var(--rs);margin:8px 0 6px;letter-spacing:.5px}
.eq-line-wrap{margin-bottom:6px}
.eq-line-label{font-size:11px;font-weight:700;color:var(--muted);padding:3px 0 3px 4px;width:72px;flex-shrink:0}
.eq-line-row{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.eq-btn{padding:7px 8px;font-size:11px;font-weight:600;border:1.5px solid var(--border);border-radius:var(--rs);background:var(--white);color:var(--muted);cursor:default;font-family:inherit;white-space:nowrap;opacity:.55;min-width:68px;text-align:center;transition:all .2s}
.eq-btn.active{background:var(--blue);color:white;border-color:var(--blue);opacity:1;cursor:pointer;box-shadow:0 2px 8px rgba(26,95,168,.3)}
.eq-btn.active:active{transform:scale(.96)}
/* 未点検 = デフォルト青 */
.eq-btn.st-none{background:var(--blue);color:white;border-color:var(--blue);opacity:1;cursor:pointer}
/* 点検済みOK（全項目OK）*/
.eq-btn.st-ok{background:#2e7d32;color:white;border-color:#1b5e20;opacity:1;cursor:pointer;box-shadow:0 2px 8px rgba(46,125,50,.35)}
/* 点検済みNG（NG項目あり）*/
.eq-btn.st-ng{background:#c62828;color:white;border-color:#b71c1c;opacity:1;cursor:pointer;box-shadow:0 2px 8px rgba(198,40,40,.35)}
/* 片方のみ完了（D or N）*/
.eq-btn.st-partial{background:#e65100;color:white;border-color:#bf360c;opacity:1;cursor:pointer;box-shadow:0 2px 8px rgba(230,81,0,.3)}
.eq-btn.active:active,.eq-btn.st-none:active,.eq-btn.st-ok:active,.eq-btn.st-ng:active,.eq-btn.st-partial:active{transform:scale(.96)}
/* チェックシートページ */
#checksheet-page{display:none}
.cs-back-bar{background:var(--blue-d);padding:10px 14px;display:flex;align-items:center;gap:10px;cursor:pointer}
.cs-back-btn{background:rgba(255,255,255,.2);border:none;color:white;font-size:12px;font-weight:600;padding:5px 12px;border-radius:12px;cursor:pointer;font-family:inherit}
.cs-back-title{color:white;font-size:13px;font-weight:600}
</style>
</head>
<body>

<!-- ログイン画面 -->
<div id="login-screen">
  <div class="lcard">
    <div class="llogo">
      <div class="llogo-icon">🔒</div>
      <h2>管理記録システム</h2>
      <p style="font-size:13px;font-weight:700;color:var(--blue);margin:4px 0 2px">OGINO VIETNAM TU SON</p>
      <p>Hệ thống quản lý hồ sơ</p>
    </div>
    <div class="lfield">
      <label>Tên người dùng / ユーザー名</label>
      <input class="linput" type="text" id="lu" placeholder="" autocomplete="off"
        onkeydown="if(event.key==='Enter')document.getElementById('lp').focus()">
    </div>
    <div class="lfield" style="margin-bottom:8px">
      <label>Mật khẩu / パスワード</label>
      <div style="position:relative">
        <input class="linput" type="password" id="lp" placeholder="" autocomplete="new-password"
          onkeydown="if(event.key==='Enter')doLogin()">
        <button onclick="document.getElementById('lp').type=document.getElementById('lp').type==='password'?'text':'password'"
          style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:18px;color:var(--muted);padding:0">👁</button>
      </div>
    </div>
    <div id="lerr" class="lerr"></div>
    <div id="lattempts" class="lattempts"></div>
    <button class="lbtn" id="lbtn" onclick="doLogin()">Đăng nhập</button>
  </div>
</div>

<!-- ダッシュボード（ホーム） -->
<div id="home-page">
  <div class="home-header">
    <h1 id="home-title">管理記録システム</h1>
    <p>OGINO VIETNAM TU SON</p>
    <div id="home-date" style="margin-top:8px;font-size:13px;font-weight:700;background:rgba(255,255,255,.15);padding:5px 16px;border-radius:20px;display:inline-block;letter-spacing:.5px"></div>
    <div class="user-bar">
      <span id="home-user">👤 admin</span>
      <button onclick="doLogout()" style="background:rgba(255,255,255,.2);border:none;color:white;font-size:11px;padding:3px 10px;border-radius:10px;cursor:pointer;font-family:inherit" id="home-logout">ログアウト</button>
    </div>
  </div>
  
  <!-- カテゴリータブ -->
<div style="display:flex;background:#f5f7fa;border-bottom:2px solid #1a5fa8">
  <button id="tab-equip" onclick="switchCategory('equip')" style="flex:1;padding:10px 6px;font-size:12px;font-weight:700;background:#1a5fa8;color:white;border:none;cursor:pointer;font-family:inherit;transition:all .2s"><span id="tab-equip-main">⚙️ 設備点検</span><br><span id="tab-equip-sub" style='font-size:10px;font-weight:400'>Kiểm tra thiết bị</span></button>
  <button id="tab-jig" onclick="switchCategory('jig')" style="flex:1;padding:10px 6px;font-size:12px;font-weight:700;background:#f5f7fa;color:#555;border:none;border-left:1px solid #ddd;cursor:pointer;font-family:inherit;transition:all .2s"><span id="tab-jig-main">🔩 治具点検</span><br><span id="tab-jig-sub" style='font-size:10px;font-weight:400'>Kiểm tra đồ gá</span></button>
</div>
<div style="padding:8px 14px;background:#e3f2fd;border-bottom:1px solid #bbdefb;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px">

function renderEquipmentGrid(){
  const grid=document.getElementById('eq-grid');
  if(!grid)return;
  const isJA=LANG==='ja';
  let h='';
  if(currentMode==='jig'){
    // 治具点検グリッド（LINE別）
    JIG_SECTIONS.forEach(sec=>{
      h+=`<div class="eq-section"><div class="eq-section-title">${isJA?sec.label.ja:sec.label.vn}</div>`;
      sec.lines.forEach(lineData=>{
        h+=`<div class="eq-line-wrap"><div class="eq-line-row"><span class="eq-line-label">${lineData.line}</span>`;
        lineData.ops.forEach(op=>{
          // op は文字列 または {key, disabled} オブジェクト
          const opKey = (typeof op==='string') ? op : op.key;
          const isDisabled = (typeof op==='object') && op.disabled;
          const key = lineData.line+'_'+opKey;
          const eq = JIG_ACTIVE_EQUIPMENT[key];
          if(eq && !isDisabled){
            const st=getTodayStatus(key);
            h+=`<button class="eq-btn st-${st}" data-eq-key="${key}">${getStatusLabel(st,isJA,opKey)}</button>`;
          }
          // disabled ボタンは表示しない
        });
        h+='</div></div>';
      });
      h+='</div>';
    });
  } else {
    EQ_SECTIONS.forEach(sec=>{
      h+=`<div class="eq-section">
        <div class="eq-section-title">${isJA?sec.label.ja:sec.label.vn}</div>`;
      sec.lines.forEach(lineData=>{
        h+=`<div class="eq-line-wrap"><div class="eq-line-row">
          <span class="eq-line-label">${lineData.line}</span>`;
        lineData.ops.forEach(op=>{
          const key=lineData.line+'_'+op;
          const eq=ACTIVE_EQUIPMENT[key];
          if(eq){
            const st=getTodayStatus(key);
            h+=`<button class="eq-btn st-${st}" data-eq-key="${key}">${getStatusLabel(st,isJA,op)}</button>`;
          }else{
            h+=`<button class="eq-btn" disabled>${op}</button>`;
          }
        });
        h+=`</div></div>`;
      });
      h+='</div>';
    });
  }
  grid.innerHTML=h;

  // イベント委譲：グリッド全体にクリックリスナーを1つだけ設定
  grid.onclick=function(e){
    const btn=e.target.closest('button[data-eq-key]');
    if(!btn)return;
    const key=btn.getAttribute('data-eq-key');
    if(key)showChecksheet(key);
  };
}

/* =====================================================
   認証設定
   ===================================================== */
const AUTH={u:'admin',p:'1234',max:5,lockSec:60,sk:'login_sess',tk:'login_tries',lk:'login_lock'};

function h32(s){let h=0;for(let i=0;i<s.length;i++)h=(Math.imul(31,h)+s.charCodeAt(i))|0;return h.toString(36)}
const HU=h32(AUTH.u), HP=h32(AUTH.p);

function isLocked(){return Date.now()<parseInt(localStorage.getItem(AUTH.lk)||'0')}
function lockSec(){return Math.ceil((parseInt(localStorage.getItem(AUTH.lk)||'0')-Date.now())/1000)}
function getTries(){return parseInt(localStorage.getItem(AUTH.tk)||'0')}
function isLoggedIn(){return sessionStorage.getItem(AUTH.sk)==='1'}

function doLogin(){
  if(isLocked()){showLoginErr('Bị khóa. Thử lại sau '+lockSec()+'s');return}
  const u=(document.getElementById('lu').value||'').trim();
  const p=(document.getElementById('lp').value||'');
  if(!u){document.getElementById('lu').classList.add('err');return}
  if(!p){document.getElementById('lp').classList.add('err');return}
  document.getElementById('lu').classList.remove('err');
  document.getElementById('lp').classList.remove('err');
  if(h32(u)===HU&&h32(p)===HP){
    localStorage.removeItem(AUTH.tk);localStorage.removeItem(AUTH.lk);
    sessionStorage.setItem(AUTH.sk,'1');
    sessionStorage.setItem('lu',u);
    startApp();
  }else{
    const tries=getTries()+1;localStorage.setItem(AUTH.tk,tries);
    const rem=AUTH.max-tries;
    if(tries>=AUTH.max){
      localStorage.setItem(AUTH.lk,Date.now()+AUTH.lockSec*1000);
      localStorage.removeItem(AUTH.tk);
      showLoginErr('Sai '+AUTH.max+' lần. Khóa '+AUTH.lockSec+'s');
      const btn=document.getElementById('lbtn');btn.disabled=true;
      setTimeout(()=>{btn.disabled=false;document.getElementById('lerr').textContent='';document.getElementById('lattempts').textContent=''},AUTH.lockSec*1000);
    }else{
      showLoginErr('Sai tên/mật khẩu.');
      document.getElementById('lattempts').textContent='Còn '+rem+' lần thử';
    }
    document.getElementById('lp').value='';document.getElementById('lp').focus();
  }
}
function showLoginErr(msg){document.getElementById('lerr').textContent=msg}

function startApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('langbtn').textContent=LANG==='vn'?'日本語':'Tiếng Việt';
  syncAndStart(); // ← khởi Firebase rồi mới vào app
}

function doLogout(){
  sessionStorage.removeItem(AUTH.sk);
  localStorage.removeItem('app_lang');
  location.reload();
}

  lines.push('.card{background:white;border-radius:10px;padding:14px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.1);page-break-inside:avoid}');
  lines.push('.ct{font-size:14px;font-weight:700;color:#1a2027;margin-bottom:3px}');
  lines.push('.cp{font-size:10px;color:#666;margin-bottom:10px;line-height:1.5}');
  lines.push('.qbox{display:inline-block;padding:8px;border:2px solid #1a5fa8;border-radius:8px;margin-bottom:8px}');
  lines.push('.url{font-size:8px;color:#aaa;word-break:break-all;margin-top:4px}');
  lines.push('@media print{.no-print{display:none!important} body{background:white;padding:8px} .card{box-shadow:none;border:1px solid #ccc}}');
  lines.push('</style>');
  lines.push('<scr'+'ipt src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\/scr'+'ipt>');
  lines.push('</head><body>');
  lines.push('<h1>設備点検チェックシート QRコード一覧</h1>');
  lines.push('<p class="sub">OGINO VIETNAM TU SON &nbsp;|&nbsp; Danh sách QR code kiểm tra thiết bị</p>');
  lines.push('<p class="sub no-print"><button class="prbtn" onclick="window.print()">🖨 印刷する / In QR code</button></p>');
  lines.push('<p class="sub" style="color:#e65100;font-size:11px">※ 各設備の機械に貼付してください / Dán QR code lên từng máy</p>');

  eqList.forEach(eq=>{
    const url = baseURL + '?eq=' + encodeURIComponent(eq.key);

/* =====================================================
   今日の点検状況を設備ごとに取得
   戻り値: 'none' | 'ok' | 'ng' | 'partial'
   ===================================================== */
function getTodayStatus(eqKey){
  const today = td(); // 今日の日付 YYYY-MM-DD
  try{
    const recs = JSON.parse(localStorage.getItem(eqStKey(eqKey))||'[]');
    const todayRecs = recs.filter(r=>r.date===today);
    if(!todayRecs.length) return 'none'; // 未点検

    const aeq = getActiveEquipment();
    const eq = aeq[eqKey];
    if(!eq) return 'none';
    const items = currentMode==='jig'?((JIG_DEF[eq.op])||[]):(DEF[eq.op]||DEF['OP20/30']);

    let hasD=false, hasN=false, hasNG=false;
    todayRecs.forEach(r=>{
      if(r.shift==='D') hasD=true;
      else hasN=true;
      // NG項目チェック
      Object.values(r.vals||{}).forEach(v=>{
        if(v.D==='NG'||v.N==='NG') hasNG=true;
        // 数値型のNG判定
        items.forEach((item,idx)=>{
          if(item.tp==='numeric'){
            const dv=(r.vals[idx]||{}).Dv;
            const nv=(r.vals[idx]||{}).Nv;
            if(dv!==undefined&&dv!==''&&(parseFloat(dv)<item.min||parseFloat(dv)>item.max)) hasNG=true;
            if(nv!==undefined&&nv!==''&&(parseFloat(nv)<item.min||parseFloat(nv)>item.max)) hasNG=true;
          }
        });
      });
    });

    if(hasNG) return 'ng';
    if(hasD&&hasN) return 'ok';   // 昼・夜両方完了でNG無し
    return 'partial';              // 片方のみ完了
  }catch(e){ return 'none'; }
}

/* 設備ステータスのラベルテキスト */
function getStatusLabel(status, isJA, op){
  if(status==='none')    return op+'<br><span style="font-size:9px;opacity:.9">▶ '+(isJA?'未点検':'Chưa KT')+'</span>';
  if(status==='ok')      return op+'<br><span style="font-size:9px">✓ '+(isJA?'完了 OK':'Hoàn tất OK')+'</span>';
  if(status==='ng')      return op+'<br><span style="font-size:9px">✗ '+(isJA?'NG あり':'Có NG')+'</span>';
  if(status==='partial') return op+'<br><span style="font-size:9px">◑ '+(isJA?'一部完了':'Một phần')+'</span>';
  return op;
}

/* JIG_ACTIVE_EQUIPMENT と JIG_SECTIONS をコンフィグから生成 */
const JIG_ACTIVE_EQUIPMENT = {};
const JIG_SECTIONS = [];

function _buildJigSection(secLabel, lines, opList){
  const sec = {label:secLabel, lines:[]};
  lines.forEach(line=>{
    const lineOps = [];
    opList.forEach(op=>{
      const key = line + '_' + op.key;
      JIG_ACTIVE_EQUIPMENT[key] = {
        title:   line + ' ' + op.key,
        titleVn: line + ' ' + op.key,
        op:      op.defKey,
        procJa:  op.procJa,
        procVn:  op.procVn,
        machJa:  op.machJa || '',
        machVn:  op.machVn || '',
        dept:    'OVT'
      };
      lineOps.push(op.key);
    });
    sec.lines.push({line:line, ops:lineOps});
  });
  JIG_SECTIONS.push(sec);
}

(function(){
  const sec={label:{ja:'1Line 〜 5Line（後工程）',vn:'Line 1-5 (Sau công đoạn)'},lines:[]};
  // Line 1-3 と Line 4-5 で扱うOPが異なる。共通の表示順を定義し、不在のOPは無効ボタンで表示
  const allOps=['NhapKhay','OP130','OP140','OP150','OP155','OP160','OP170','OP180','OP190'];
  const opMeta={
    NhapKhay:{procJa:'原料トレー投入',procVn:'Nhập khay NL'},
    OP130:   {procJa:'OP130 切粉取・バリ取',procVn:'OP130 Lấy phoi'},
    OP140:   {procJa:'OP140 洗浄機',       procVn:'OP140 Máy rửa'},
    OP150:   {procJa:'OP150 電解バリ取',   procVn:'OP150 Điện phân'},
    OP155:   {procJa:'OP155 反転機',       procVn:'OP155 Đảo chiều'},
    OP160:   {procJa:'OP160 高圧洗浄',     procVn:'OP160 Rửa cao áp'},
    OP170:   {procJa:'OP170 洗浄機',       procVn:'OP170 Máy rửa'},
    OP180:   {procJa:'OP180 測定機',       procVn:'OP180 Máy đo'},
    OP190:   {procJa:'OP190 内視鏡',       procVn:'OP190 Nội soi'},
  };
  // Line 1-3 が持つOP (Nhập khay, OP140, OP155 は無し)
  const opsL1to3=['OP130','OP150','OP160','OP170','OP180','OP190'];
  // Line 4-5 が持つOP (全部)
  const opsL4to5=allOps;
  // 各ラインの defKey マッピング
  const defKeyOf=(line,opKey)=>{
    if(['1Line','2Line','3Line'].includes(line)){
      return 'L1to3_'+opKey;
    }
    return 'L4to5_'+opKey;
  };

  ['1Line','2Line','3Line','4Line','5Line'].forEach(line=>{
    const isL123 = ['1Line','2Line','3Line'].includes(line);
    const availOps = isL123 ? opsL1to3 : opsL4to5;
    const lineOps=[];
    allOps.forEach(opKey=>{
      if(!availOps.includes(opKey)){
        // このLineにこのOPは存在しない → disabled表示
        lineOps.push({key:opKey,disabled:true});
        return;
      }
      const key=line+'_'+opKey;
      const dk=defKeyOf(line,opKey);
      const meta=opMeta[opKey];
      JIG_ACTIVE_EQUIPMENT[key]={
        title:line+' '+opKey,titleVn:line+' '+opKey,
        op:dk,procJa:meta.procJa,procVn:meta.procVn,
        machJa:'',machVn:'',dept:'OVT'
      };
      lineOps.push({key:opKey,disabled:false});
    });
    sec.lines.push({line:line,ops:lineOps});
  });
  JIG_SECTIONS.push(sec);
})();

function jigStorageKey(eqKey){ return 'jig_'+eqKey.replace(/[/ ]/g,'_')+'_v1'; }
function jigWeeklyKey(eqKey){  return 'jig_wk_'+eqKey.replace(/[/ ]/g,'_')+'_v1'; }

function getActiveEquipment(){ return currentMode==='jig'?JIG_ACTIVE_EQUIPMENT:ACTIVE_EQUIPMENT; }
function getDefDict(){        return currentMode==='jig'?JIG_DEF:DEF; }

function eqStKey(eqKey){
  return currentMode==='jig'?jigStorageKey(eqKey):eqStorageKey(eqKey);
}
function eqWkKey(eqKey){
  return currentMode==='jig'?jigWeeklyKey(eqKey):eqWeeklyKey(eqKey);
}

function chkR(item,val){
  if(val===''||val===null||val===undefined)return'empty';
  const n=parseFloat(val);if(isNaN(n))return'empty';
  if(item.min===undefined||item.max===undefined)return'empty';
  return(n>=item.min&&n<=item.max)?'in-range':'out-range';
}

    '1Line':'1Line','2Line':'2Line','3Line':'3Line','4Line':'4Line','5Line':'5Line',
    '6Line':'6Line','7Line':'7Line','8Line':'8Line','9Line':'9Line','10Line':'10Line',
    '11Line':'11Line','12Line':'12Line','13Line':'13Line','14Line':'14Line',
    '15Line':'15Line','16Line':'16Line','17Line':'17Line','18Line':'18Line',

function setShift(s){
  const opEl=document.getElementById('fi-op');

function updProg(){
  const sh=CM.shift||'D';
  let done=0; const missing=[];
  ITEMS.forEach((item,idx)=>{
    const cv=CV[idx]||{};
    const ok=item.tp==='numeric'?(cv[sh+'v']!==undefined&&cv[sh+'v']!==''):!!cv[sh];
    if(ok)done++;else missing.push(item.lb+'.'+iN(item));
  });
  const pct=Math.round(done/ITEMS.length*100);
  const f=document.getElementById('pf');const t2=document.getElementById('pt');
  if(f){f.style.width=pct+'%';f.style.background=done===ITEMS.length?'var(--green)':'var(--blue)'}
  if(t2)t2.textContent=pct+'% ('+done+'/'+ITEMS.length+')';
  const btn=document.getElementById('sbtn');const hint=document.getElementById('shint');
  if(btn){
    btn.disabled=done!==ITEMS.length;
    if(done===ITEMS.length){btn.textContent=L('all_done');btn.style.background='var(--green)'}
    else{btn.textContent=L('btn_save')+' ('+done+'/'+ITEMS.length+')';btn.style.background=''}
  }
  if(hint){
    if(missing.length){hint.textContent=L('remain_pre')+missing.length+L('remain_suf')+': '+missing.slice(0,3).join(', ')+(missing.length>3?'...':'')}
    else hint.textContent='';
  }
}

let _ni=null,_nr=null,_nv='';

function openNP(idx,row){
  _ni=idx;_nr=row;
  const cv=CV[idx]||{};
  _nv=(cv[row+'v']!==undefined&&cv[row+'v']!=='')?String(cv[row+'v']):'';
  const item=ITEMS[idx];
  const caLbl=CM.shift==='D'?L('f_day').replace('☀ ',''):L('f_night').replace('🌙 ','');
  document.getElementById('npLbl').textContent=iN(item)+' ('+caLbl+')';
  document.getElementById('npUnit').textContent=item.unit;
  document.getElementById('npRange').textContent=(LANG==='ja'?'基準: ':'Tiêu chuẩn: ')+iC(item);
  updND();
  document.getElementById('npOv').classList.add('open');
}
function updND(){
  const item=ITEMS[_ni];
  const d=document.getElementById('npDisp');
  d.textContent=_nv===''?'—':_nv;
  const r=chkR(item,_nv);
  d.className='np-disp'+(r==='in-range'?' in-range':r==='out-range'?' out-range':'');
}
function npP(ch){
  const md=(ITEMS[_ni]&&ITEMS[_ni].dec)||1;
  if(ch==='.'&&_nv.includes('.'))return;
  if(_nv.includes('.')&&_nv.split('.')[1].length>=md)return;
  if(_nv==='0'&&ch!=='.')_nv=ch;else _nv+=ch;
  updND();
}
function npBk(){_nv=_nv.slice(0,-1);updND()}
function npCl(){document.getElementById('npOv').classList.remove('open')}
function npOK(){
  if(_ni===null)return;
  const item=ITEMS[_ni];const row=_nr;
  const md=item.dec||1;const fac=Math.pow(10,md);
  const rounded=(_nv!==''&&!isNaN(parseFloat(_nv)))?(Math.round(parseFloat(_nv)*fac)/fac).toFixed(md):'';
  if(!CV[_ni])CV[_ni]={};
  CV[_ni][row+'v']=rounded;
  const rng=chkR(item,rounded);
  CV[_ni][row]=rng==='in-range'?'OK':rng==='out-range'?'NG':null;
  const wrap=document.getElementById('nw'+_ni+row);
  const disp=document.getElementById('nv'+_ni+row);
  const stat=document.getElementById('ns'+_ni+row);
  if(wrap)wrap.className='nwrap'+(rng!=='empty'?' '+rng:'');
  if(disp){disp.textContent=rounded!==''?rounded+' '+item.unit:L('tap');disp.style.color=rounded!==''?'var(--text)':'var(--muted)'}
  if(stat){stat.className='nstat '+rng;stat.textContent=rng==='in-range'?L('in_range'):rng==='out-range'?L('out_range'):iC(item)}
  updProg();npCl();
}
document.getElementById('npOv').addEventListener('click',e=>{if(e.target===document.getElementById('npOv'))npCl()});

function setDN(idx,row,val){
  if(!CV[idx])CV[idx]={};
  CV[idx][row]=CV[idx][row]===val?null:val;
  const cur=CV[idx][row];
  ['OK','NG','NA'].forEach(v=>{const b=document.getElementById('b'+idx+row+v);if(b)b.className='dnbtn'+(cur===v?' '+v.toLowerCase():'')});
  updProg();
}

   保存
   ===================================================== */
function saveRec(){
  const _dtEl=document.getElementById('fi-dt');if(_dtEl)CM.date=_dtEl.value;
  const _opEl=document.getElementById('fi-op');if(_opEl)CM.op=_opEl.value;
  if(!CM.date){showToast(L('need_date'));return}
  const sh=CM.shift||'D';
  const missing=[];
  ITEMS.forEach((item,idx)=>{
    const cv=CV[idx]||{};
    const ok=item.tp==='numeric'?(cv[sh+'v']!==undefined&&cv[sh+'v']!==''):!!cv[sh];
    if(!ok)missing.push(item.lb);
  });
  if(missing.length){showToast(missing.length+L('need_all'));return}
  ITEMS.forEach((_,idx)=>{const el=document.getElementById('rk'+idx);if(el){if(!CV[idx])CV[idx]={};CV[idx].note=el.value}});
  // 数値の最終丸め
  ITEMS.forEach((item,idx)=>{
    if(item.tp==='numeric'){
      const md=item.dec||1;const fac=Math.pow(10,md);
      ['D','N'].forEach(r=>{
        const v=(CV[idx]||{})[r+'v'];
        if(v!==undefined&&v!==''&&!isNaN(parseFloat(v))){
          if(!CV[idx])CV[idx]={};
          CV[idx][r+'v']=(Math.round(parseFloat(v)*fac)/fac).toFixed(md);
        }
      });
    }
  });
  const eqInf=currentEquipment?ACTIVE_EQUIPMENT[currentEquipment]:null;
  const rec={id:Date.now(),date:CM.date,eqKey:currentEquipment,op:CM.op,shift:CM.shift,vals:JSON.parse(JSON.stringify(CV))};
  records.unshift(rec);sdr();
  showToast(L('saved'));

}

function wmOK(){
  const name=(document.getElementById('wmInput').value||'').trim();
  if(!name)return;
  const wk=getWk(td());
  weekly.unshift({id:Date.now(),date:td(),week:wk,name:name});
  sdw();
  document.getElementById('wmOv').classList.remove('open');
  showToast(L('w_saved'));
}
function getWk(dateStr){
  const d=new Date(dateStr);
  const jan1=new Date(d.getFullYear(),0,1);
  const wn=Math.ceil(((d-jan1)/86400000+jan1.getDay()+1)/7);
  return d.getFullYear()+'-W'+String(wn).padStart(2,'0');
}

/* =====================================================
   集計ヘルパー
   ===================================================== */
function sumRec(r){
  let ok=0,ng=0,na=0,done=0;
  ITEMS.forEach((item,idx)=>{
    const v=(r.vals||{})[idx]||{};
    ['D','N'].forEach(row=>{
      let st;
      if(item.tp==='numeric'){const val=row==='D'?v.Dv:v.Nv;const rng=chkR(item,val);st=rng==='in-range'?'OK':rng==='out-range'?'NG':null}
      else{st=v[row]||null}
      if(st==='OK'){ok++;done++}else if(st==='NG'){ng++;done++}else if(st==='NA'){na++;done++}
    });
  });
  return{ok,ng,na,done,total:ITEMS.length*2};
}

function renderStats(){

  let tOK=0,tNG=0,tNA=0,tDone=0;const ngMap={};
  records.forEach(r=>{
    ITEMS.forEach((item,idx)=>{
      const v=(r.vals||{})[idx]||{};
      ['D','N'].forEach(row=>{
        let st;
        if(item.tp==='numeric'){const val=row==='D'?v.Dv:v.Nv;const rng=chkR(item,val);st=rng==='in-range'?'OK':rng==='out-range'?'NG':null}
        else{st=v[row]||null}
        if(st==='OK'){tOK++;tDone++}else if(st==='NG'){tNG++;tDone++;ngMap[iN(item)]=(ngMap[iN(item)]||0)+1}else if(st==='NA'){tNA++;tDone++}

  h+='</div>';

  h+=`<button class="expbtn" onclick="exportExcel()">${L('s_export')}</button>`;

/* =====================================================
   Excel出力
   ===================================================== */
async function exportExcel(){
  const isJA = LANG==='ja';

  // データ収集
  migrateOldData();
  const exportMode = currentMode;
  const _eqMap = getActiveEquipment();

  // localStorage から有データ設備を収集
  const hasData = Object.keys(_eqMap).filter(k=>{
    try{ return JSON.parse(localStorage.getItem(eqStKey(k))||'[]').length>0; }
    catch(e){ return false; }
  });

  // 現在セッションのデータも対象に
  const targets = hasData.length>0 ? hasData : (currentEquipment?[currentEquipment]:[]);
  if(targets.length===0 && records.length===0){
    showToast(L('ex_fail')); return;
  }

  showToast(isJA?'Excel生成中...':'Đang tạo Excel...');

  // ExcelJS ロード
  if(!window.ExcelJS){
    try{
      await new Promise((res,rej)=>{
        const s=document.createElement('script');
        s.src='https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
        s.onload=res; s.onerror=()=>rej(new Error('CDN load failed'));
        document.head.appendChild(s);
      });
    }catch(e){
      showToast(isJA?'ExcelJS読み込み失敗。ネット接続を確認してください':'Lỗi tải ExcelJS');
      return;
    }
  }

  try{
    const wb = new ExcelJS.Workbook();
    let sheetCount = 0;

    // 処理対象リスト（currentEquipmentも含める）
    const allTargets = new Set(targets);
    if(currentEquipment && records.length>0) allTargets.add(currentEquipment);

    for(const eqKey of allTargets){
      const eq = _eqMap[eqKey];
      if(!eq) continue;

      // レコード取得（セッション中のデータ or localStorage）
      let eqRecs = JSON.parse(localStorage.getItem(eqStKey(eqKey))||'[]');
      if(eqRecs.length===0 && eqKey===currentEquipment && records.length>0) eqRecs=records;
      if(!eqRecs.length) continue;

      const eqWeekly = JSON.parse(localStorage.getItem(eqWkKey(eqKey))||'[]');
      const eqItems  = exportMode==='jig' ? (JIG_DEF[eq.op]||[]) : (DEF[eq.op]||DEF['OP20/30']);

      const ld=eqRecs[0].date;
      const[yyyy,mm]=ld.split('-');
      const dim=new Date(+yyyy,+mm,0).getDate();
      const lr=eqRecs[0];

      // 日別マップ
      const dmD={},dmN={},dm={};
      [...eqRecs].reverse().forEach(r=>{
        if(!r.date.startsWith(yyyy+'-'+mm)) return;
        const d=+r.date.split('-')[2];
        if(r.shift==='N'){ if(!dmN[d]) dmN[d]=r; }
        else              { if(!dmD[d]) dmD[d]=r; }
        if(!dm[d]) dm[d]=r;
      });
      const wkMap={};
      eqWeekly.forEach(w=>{
        if(w.date.startsWith(yyyy+'-'+mm)){
          const wn=Math.ceil(+w.date.split('-')[2]/7);
          if(!wkMap[wn]) wkMap[wn]=w.name;
        }
      });

      const sheetName=(isJA?eq.title:eq.titleVn).replace(/[*?:\\/\[\]]/g,'-').slice(0,31);
      const ws=wb.addWorksheet(sheetName,{
        pageSetup:{orientation:'landscape',fitToPage:true,fitToWidth:1},
        views:[{showGridLines:false}]
      });
      sheetCount++;

      // 列幅設定
      [4.5,20,14,5,9,8,3.5].forEach((w,i)=>ws.getColumn(i+1).width=w);
      for(let d=1;d<=dim;d++) ws.getColumn(8+d-1).width=3.8;
      const LC=8+dim-1;

      // ヘルパー
      const tb={style:'thin'};const B={top:tb,bottom:tb,left:tb,right:tb};
      const F=(bold,sz,color='FF000000')=>({bold,size:sz,color:{argb:color},name:'Arial'});
      const A=(h='center',v='middle')=>({horizontal:h,vertical:v,wrapText:true});
      const FI=(a)=>({type:'pattern',pattern:'solid',fgColor:{argb:a}});
      function W(r,col,v,o){
        const cell=ws.getCell(r,col);cell.value=v;
        if(o){if(o.f)cell.font=o.f;if(o.fi)cell.fill=o.fi;if(o.a)cell.alignment=o.a;if(o.b)cell.border=o.b;if(o.n)cell.numFmt=o.n;}
      }
      function MG(r1,c1,r2,c2){try{ws.mergeCells(r1,c1,r2,c2);}catch(e){}}

      const NAVY='FF1F3864',LB='FFBDD7EE';

      // 行高さ
      ws.getRow(1).height=4; ws.getRow(2).height=24; ws.getRow(3).height=4;
      ws.getRow(4).height=14; ws.getRow(5).height=14; ws.getRow(6).height=14;
      ws.getRow(7).height=20; ws.getRow(8).height=13; ws.getRow(9).height=13;

      // Row2: タイトル
      const xlKind=exportMode==='jig'?(isJA?'治具点検チェックシート':'Checksheet kiểm tra đồ gá'):(isJA?'設備点検チェックシート':'Checksheet kiểm tra thiết bị');
      MG(2,1,2,7);
      W(2,1,`  ${yyyy}年${mm}月度　${xlKind}`,{f:F(true,13,'FFFFFFFF'),fi:FI(NAVY.slice(2)),a:A('left')});
      MG(2,8,2,LC);
      W(2,8,isJA?`作成 ${yyyy}年${mm}月01日`:`Lập ngày 01/${mm}/${yyyy}`,{f:F(false,8),a:A('right','middle')});

      // Row4-6: 基本情報
      MG(4,2,4,5); MG(4,7,4,7);
      W(4,1,isJA?'LINE':'LINE',{f:F(true,8),fi:FI(LB.slice(2)),a:A(),b:B});
      W(4,2,getLineName(eqKey,isJA),{f:F(false,9),fi:FI('FFFAFAFA'),a:A('left'),b:B});
      W(4,6,isJA?'所属':'Trực thuộc',{f:F(true,8),fi:FI(LB.slice(2)),a:A(),b:B});
      W(4,7,eq.dept||'OVT',{f:F(false,9),fi:FI('FFFAFAFA'),a:A('left'),b:B});
      MG(5,2,5,7);
      W(5,1,isJA?'工程名':'Tên CĐ',{f:F(true,8),fi:FI(LB.slice(2)),a:A(),b:B});
      W(5,2,isJA?eq.procJa:eq.procVn,{f:F(false,9),fi:FI('FFFAFAFA'),a:A('left'),b:B});
      MG(6,2,6,7);
      W(6,1,isJA?'担当者':'Người p.trách',{f:F(true,8),fi:FI(LB.slice(2)),a:A(),b:B});
      W(6,2,lr.op||'',{f:F(false,9),fi:FI('FFFAFAFA'),a:A('left'),b:B});

      // Row7: 列ヘッダー
      [[1,isJA?'№':'No.'],[2,isJA?'点検項目':'Hạng mục'],[3,isJA?'基準':'Tiêu chuẩn'],
       [4,isJA?'周期':'Chu kỳ'],[5,isJA?'方法':'Phương thức'],[6,isJA?'備考':'Ghi chú'],[7,isJA?'直':'Ca']
      ].forEach(([col,lbl])=>W(7,col,lbl,{f:F(true,8,'FFFFFFFF'),fi:FI(NAVY.slice(2)),a:A(),b:B}));
      for(let d=1;d<=dim;d++){
        const wd=new Date(+yyyy,+mm-1,d).getDay();
        W(7,8+d-1,d,{f:F(true,7,'FFFFFFFF'),fi:FI(wd===0?'FFC00000':wd===6?'FF4472C4':NAVY.slice(2)),a:A(),b:B});
      }

      // Row8/9: 担当者（昼/夜）
      MG(8,1,8,7); W(8,1,isJA?'昼番担当者':'Ca ngày (D)',{f:F(true,8,'FF7B4F00'),fi:FI('FFFFF8E1'),a:A('left'),b:B});
      MG(9,1,9,7); W(9,1,isJA?'夜番担当者':'Ca đêm (N)', {f:F(true,8,'FF1A237E'),fi:FI('FFE8EAF6'),a:A('left'),b:B});
      for(let d=1;d<=dim;d++){
        const wd=new Date(+yyyy,+mm-1,d).getDay();
        const dBg=wd===0?'FFFDE8C0':wd===6?'FFDCE8F9':'FFFFF8E1';
        const nBg=wd===0?'FFFDE4EC':wd===6?'FFD9E8F5':'FFE8EAF6';
        W(8,8+d-1,dmD[d]?dmD[d].op||'':'',{f:F(false,7,'FF7B4F00'),fi:FI(dBg),a:A(),b:B});
        W(9,8+d-1,dmN[d]?dmN[d].op||'':'',{f:F(false,7,'FF1A237E'),fi:FI(nBg),a:A(),b:B});
      }

      // 点検項目
      const BR=10;
      eqItems.forEach((item,idx)=>{
        const rD=BR+idx*3,rN=BR+idx*3+1,rS=BR+idx*3+2;
        ws.getRow(rD).height=15; ws.getRow(rN).height=13; ws.getRow(rS).height=3;
        const nm=isJA?item.ja:item.vn, cr=isJA?item.cja:item.cvn;
        const pr=isJA?item.pja:item.pvn, mt=isJA?item.mja:item.mvn;
        const nt=isJA?(item.aja||''):(item.avn||'');
        [[1,item.lb,true],[2,nm,false],[3,cr,false],[4,pr,false],[5,mt,false],[6,nt,false]].forEach(([col,val,bold])=>{
          MG(rD,col,rN,col);
          W(rD,col,val,{f:F(bold,9),fi:FI('FFF2F2F2'),a:col===2?A('left'):A(),b:B});
        });
        W(rD,7,'D',{f:F(true,8,'FF1F3864'),fi:FI('FFEBF3FB'),a:A(),b:B});
        W(rN,7,'N',{f:F(true,8,'FF3949AB'),fi:FI('FFF4F9FF'),a:A(),b:B});
        for(let d=1;d<=dim;d++){
          const wd=new Date(+yyyy,+mm-1,d).getDay();
          const dBg=wd===0?'FFFDECEA':wd===6?'FFDEE8F7':'FFEBF3FB';
          const nBg=wd===0?'FFFEF4F3':wd===6?'FFEAF0FB':'FFF4F9FF';
          const rv=dm[d]?(dm[d].vals||{})[idx]||{}:{};
          let dV='',nV='';
          if(item.tp==='numeric'){
            dV=rv.Dv!==undefined&&rv.Dv!==''?parseFloat(rv.Dv):'';
            nV=rv.Nv!==undefined&&rv.Nv!==''?parseFloat(rv.Nv):'';
          }else{
            const f=s=>s==='OK'?'○':s==='NG'?'✕':s==='NA'?'－':'';
            dV=f(rv.D); nV=f(rv.N);
          }
          const inR=x=>typeof x==='number'?x>=(item.min||0)&&x<=(item.max||99999):null;
          const fmt=item.dec===2?'0.00':'0.0';
          W(rD,8+d-1,dV,{f:F(true,9,inR(dV)===true?'FF00B050':inR(dV)===false?'FFFF0000':'FF000000'),fi:FI(dBg),a:A(),b:B,n:typeof dV==='number'?fmt:'@'});
          W(rN,8+d-1,nV,{f:F(false,8,inR(nV)===true?'FF00B050':inR(nV)===false?'FFFF0000':'FF1F3864'),fi:FI(nBg),a:A(),b:B,n:typeof nV==='number'?fmt:'@'});
        }
        for(let col=1;col<=LC;col++){ws.getCell(rS,col).fill=FI('FFE8E8E8');ws.getCell(rS,col).border={bottom:{style:'thin',color:{argb:'FFAAAAAA'}}};}
      });

      // 備考行
      const lR=BR+eqItems.length*3-1;
      const ssR=lR+2; ws.getRow(ssR).height=18;
      MG(ssR,1,ssR,6); W(ssR,1,isJA?'備考':'Ghi chú',{f:F(true,10),fi:FI(LB.slice(2)),a:A('left'),b:B});
      MG(ssR,7,ssR,LC); W(ssR,7,'',{fi:FI('FFFFFFFF'),b:B});

      // 週次確認
      ws.getRow(ssR+2).height=18;
      MG(ssR+2,1,ssR+2,7);
      W(ssR+2,1,isJA?'【週次上司確認】':'【Xác nhận tuần】',{f:F(true,9,'FFFFFFFF'),fi:FI('FF3949AB'),a:A('left'),b:B});
      const wkSp=Math.floor(dim/5);
      for(let w=1;w<=5;w++){
        const c1=8+(w-1)*wkSp, c2=w===5?LC:8+w*wkSp-1;
        if(c1>c2) continue;
        MG(ssR+2,c1,ssR+2,c1+1);
        W(ssR+2,c1,isJA?`第${w}週`:`Tuần ${w}`,{f:F(true,8,'FFFFFFFF'),fi:FI('FF5C6BC0'),a:A(),b:B});
        if(c1+2<=c2){ MG(ssR+2,c1+2,ssR+2,c2); }
        W(ssR+2,c1+2,wkMap[w]||'',{f:F(false,9),fi:FI('FFFFFFFF'),a:A('left'),b:B});
      }

      ws.views=[{state:'frozen',xSplit:7,ySplit:BR-1,showGridLines:false}];
    } // end for each equipment

    if(sheetCount===0){ showToast(L('ex_fail')); return; }

    const buf=await wb.xlsx.writeBuffer();
    const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url=URL.createObjectURL(blob);
    const now=new Date();
    const y=now.getFullYear(), m=String(now.getMonth()+1).padStart(2,'0');
    const fn=exportMode==='jig'?(isJA?`治具点検_${y}年${m}月.xlsx`:`JIG_${y}_${m}.xlsx`):(isJA?`設備点検_${y}年${m}月.xlsx`:`KiemTra_${y}_${m}.xlsx`);
    const a=document.createElement('a');
    a.style.display='none'; a.href=url; a.download=fn;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); },300);
    showToast(isJA?`Excel出力完了 (${sheetCount}シート) ✓`:`Xuất Excel ${sheetCount} sheet ✓`);

  }catch(err){
    console.error('exportExcel error:',err);
    alert('Excel出力エラー:\n'+(err&&err.message?err.message:String(err)));
    showToast('Excel出力エラー: '+(err&&err.message?err.message.slice(0,40):String(err).slice(0,40)));
  }
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}

/* =====================================================
   旧データ移行（tenken_vn_v1 → 設備別キー）
   ===================================================== */
function migrateOldData(){
  const OLD_SK='tenken_vn_v1', OLD_WK='tenken_weekly_v1';
  const newSK=eqStorageKey('11Line_OP20/30');
  const newWK=eqWeeklyKey('11Line_OP20/30');
  try{
    // レコードの移行
    const oldRecs=localStorage.getItem(OLD_SK);
    if(oldRecs&&oldRecs!=='[]'){
      const newRecs=localStorage.getItem(newSK)||'[]';
      if(newRecs==='[]'){
        // 旧データを新キーにコピー（op フィールドを追加）
        const parsed=JSON.parse(oldRecs);
        const migrated=parsed.map(r=>({
          ...r,
          op: r.op||r.opD||r.operator||'',
          eqKey:'11Line_OP20/30'
        }));
        localStorage.setItem(newSK,JSON.stringify(migrated));
        console.log('Migrated',migrated.length,'records to',newSK);
      }
    }
    // 週次確認の移行
    const oldWk=localStorage.getItem(OLD_WK);
    if(oldWk&&oldWk!=='[]'){
      if(!localStorage.getItem(newWK)||localStorage.getItem(newWK)==='[]'){
        localStorage.setItem(newWK,oldWk);
      }
    }
  }catch(e){console.warn('Migration error:',e)}
}

(function init(){
  // 旧データ移行
  migrateOldData();
  // ロック中チェック
  if(isLocked()){
    const btn=document.getElementById('lbtn');if(btn)btn.disabled=true;
    showLoginErr('Bị khóa. Thử lại sau '+lockSec()+'s');
    const timer=setInterval(()=>{
      if(!isLocked()){clearInterval(timer);const b=document.getElementById('lbtn');if(b)b.disabled=false;showLoginErr('')}
      else{showLoginErr('Bị khóa. Thử lại sau '+lockSec()+'s')}
    },1000);
  }
  // 言語ボタン初期化
  const lb=document.getElementById('langbtn');
  if(lb)lb.textContent=LANG==='vn'?'日本語':'Tiếng Việt';
  // ログイン済みチェック
  if(isLoggedIn()){startApp();return}
  setTimeout(()=>{const u=document.getElementById('lu');if(u)u.focus()},100);
})();

let fbDb = null;
let fbReady = false;
const FB_ROOT = 'checkdata';

function initFirebase() {
  try {
    if (!FB_CONFIG.databaseURL || FB_CONFIG.databaseURL.includes('PASTE_YOUR')) {
      console.warn('[Firebase] Chưa cấu hình – chỉ dùng localStorage.');
      return false;
    }
    if (!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
    fbDb = firebase.database();
    fbReady = true;
    console.log('[Firebase] Kết nối thành công ✓');
    return true;
  } catch(e) {
    console.error('[Firebase] Lỗi khởi tạo:', e);
    return false;
  }
}

function fbWrite(storageKey, dataArr) {
  if (!fbReady || !fbDb) return;
  fbDb.ref(FB_ROOT + '/' + storageKey).set(dataArr)
    .catch(e => console.warn('[Firebase] Lỗi ghi:', e));
}

// Firebase trả về object {0:..., 1:...} thay vì array → cần chuyển lại
function fbToArr(val) {
  if (!val) return [];
  if (Array.isArray(val)) return val;
  if (typeof val === 'object') return Object.values(val);
  return [];
}
async function syncFromFirebase() {
  if (!fbReady || !fbDb) return;
  try {
    const snap = await fbDb.ref(FB_ROOT).get();
    if (snap.exists()) {
      const data = snap.val();
      let count = 0;
      Object.keys(data).forEach(k => {
        const arr = fbToArr(data[k]);
        if (arr.length >= 0) { localStorage.setItem(k, JSON.stringify(arr)); count++; }
      });
      console.log('[Firebase] Đồng bộ', count, 'key(s) ✓');
    }
  } catch(e) { console.warn('[Firebase] Lỗi sync:', e); }
}

function setupRealtimeListener() {
  if (!fbReady || !fbDb) return;
  fbDb.ref(FB_ROOT).on('value', snap => {
    if (!snap.exists()) return;
    const data = snap.val();
    Object.keys(data).forEach(k => {
      const cloudArr = fbToArr(data[k]);
      const localArr = JSON.parse(localStorage.getItem(k)||'[]');
      const cloudId = cloudArr.length ? (cloudArr[0].id||0) : 0;
      const localId = localArr.length ? (localArr[0].id||0) : 0;
      if (cloudArr.length !== localArr.length || cloudId !== localId) {
        localStorage.setItem(k, JSON.stringify(cloudArr));
        if (currentEquipment) {
          if (k === eqStKey(currentEquipment)) { records = cloudArr; showToast('🔄 Dữ liệu cập nhật từ máy khác'); }
          if (k === eqWkKey(currentEquipment)) { weekly = cloudArr; }
        }
        console.log('[Firebase] Real-time update:', k);
      }
    });
  }, e => console.warn('[Firebase] Lỗi listener:', e));
}

function showSyncOverlay(show, msg) {
  let el = document.getElementById('fb-sync-overlay');
  if (!el && show) {
    el = document.createElement('div');
    el.id = 'fb-sync-overlay';
    el.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(26,95,168,0.93);display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;font-family:inherit;gap:16px;';
    el.innerHTML = `<div style="font-size:36px">☁️</div>
      <div id="fb-sync-msg" style="font-size:15px;font-weight:600;">${msg||'Đang đồng bộ...'}</div>
      <div style="width:200px;height:4px;background:rgba(255,255,255,0.3);border-radius:4px;overflow:hidden;">
        <div style="width:55%;height:100%;background:white;border-radius:4px;animation:fbsl 1.2s ease-in-out infinite alternate;"></div>
      </div>
      <style>@keyframes fbsl{from{transform:translateX(-80%)}to{transform:translateX(200%)}}</style>`;
    document.body.appendChild(el);
  } else if (el) {
    const m = el.querySelector('#fb-sync-msg'); if (m && msg) m.textContent = msg;
    el.style.display = show ? 'flex' : 'none';
  }
}

async function syncAndStart() {
  const ok = initFirebase();
  if (ok) {
    showSyncOverlay(true, LANG==='ja' ? 'データを同期中...' : 'Đang đồng bộ dữ liệu...');
    await syncFromFirebase();
    showSyncOverlay(false);
    setupRealtimeListener();
  }
  if(autoOpenFromQR()) return;
  showHome();
}
